<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licht</title>
<style>
  :root {
    --bg: #120d18;
    --bg2: #1b1324;
    --card: #1e1628;
    --card-hi: #2a1d36;
    --ink: #f7eddd;
    --mute: #a99bb8;
    --faint: #6f6380;
    --amber: #ffb454;
    --amber-deep: #ff8a3d;
    --indigo: #9db0ff;
    --line: rgba(255, 255, 255, .08);
    --safe-top: 0px;
    --safe-bottom: 0px;
    --serif: ui-serif, "Noto Serif", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(255, 150, 60, .16), transparent 70%),
      linear-gradient(180deg, var(--bg2), var(--bg) 380px);
  }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--safe-top) + 14px) 16px 12px;
    background: linear-gradient(180deg, rgba(18, 13, 24, .96) 60%, rgba(18, 13, 24, 0));
    transform: translateZ(0);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 {
    margin: 0; font-family: var(--serif); font-weight: 600; font-size: 24px; letter-spacing: .2px;
    display: flex; align-items: center; gap: 10px;
  }
  .ttl { display: flex; flex-direction: column; line-height: 1.02; }
  .ttl small { margin-top: 4px; font: 500 11px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
  h1 svg { width: 26px; height: 26px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 58%;
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .05); color: var(--ink);
    font: 500 13px var(--sans); cursor: pointer;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip svg { width: 14px; height: 14px; flex: none; color: var(--amber); }
  .chip.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- list ---------- */
  main { padding: 4px 16px calc(var(--safe-bottom) + 96px); max-width: 640px; margin: 0 auto; }

  h2.month {
    margin: 26px 4px 10px; font: 600 12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
    display: flex; align-items: center; gap: 12px;
  }
  h2.month::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .more {
    display: block; width: 100%; margin: 14px 0 4px; padding: 12px; border-radius: 14px;
    border: 1px dashed var(--line); background: transparent; color: var(--mute); font: 500 14px var(--sans);
  }

  .week {
    position: relative; margin: 12px 0; padding: 14px 14px 16px; border-radius: 22px;
    background: var(--card); border: 1px solid var(--line);
  }
  .week .meta {
    display: flex; justify-content: space-between; align-items: center; margin: 0 4px 10px;
    font-size: 12px; color: var(--faint); letter-spacing: .04em;
  }
  .week .tag {
    padding: 3px 9px; border-radius: 999px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px;
    background: rgba(255, 255, 255, .06); color: var(--mute);
  }
  .week.next {
    background: linear-gradient(160deg, #35223f, #25182f 55%, #1f1628);
    border-color: rgba(255, 180, 84, .45);
    box-shadow: 0 0 0 1px rgba(255, 180, 84, .12), 0 14px 40px rgba(255, 138, 61, .16);
  }
  .week.next .tag { background: linear-gradient(90deg, var(--amber-deep), var(--amber)); color: #2a1500; }
  .week.past { opacity: .62; }

  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day {
    padding: 14px 12px 12px; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
    min-width: 0;
  }
  .day .lbl {
    display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--mute);
  }
  .day .lbl svg { width: 20px; height: 20px; flex: none; }
  .time { margin: 10px 0 6px; font-family: var(--serif); font-size: 38px; line-height: 1; font-weight: 600; letter-spacing: -.5px; white-space: nowrap; }
  .time small { margin-left: 5px; font: 600 13px var(--sans); letter-spacing: .08em; color: var(--mute); }
  .fri .time { color: var(--amber); }
  .sat .time { color: var(--indigo); }
  .next .fri .time { text-shadow: 0 0 24px rgba(255, 170, 70, .45); }
  .day .date { font-size: 13.5px; color: var(--ink); font-weight: 500; }
  .day .heb { font-size: 12.5px; color: var(--mute); margin-top: 1px; }
  .day .sub { margin-top: 8px; font-size: 12px; color: var(--faint); }

  .week.enter { animation: cardIn .38s cubic-bezier(.2, .8, .2, 1) backwards; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }
  #list { transition: opacity .18s ease; }
  #list.swap { opacity: 0; }
  .chip, .opt, .more, .zip button, .seg button { transition: transform .15s ease, background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease; }
  .chip:active, .opt:active, .more:active, .zip button:active { transform: scale(.97); }
  .foot { margin: 8px 4px 0; font-size: 11.5px; color: var(--faint); }
  .foot b { color: var(--mute); font-weight: 600; }

  .skel .time, .skel .sub, .skel .date, .skel .heb { color: transparent !important; text-shadow: none !important; }
  .skel .time, .skel .sub, .skel .date, .skel .heb { background: rgba(255, 255, 255, .09); border-radius: 8px; }
  .week.skel { animation: pulse 1.5s ease-in-out infinite; }
  .skel .time { width: 70%; } .skel .sub { width: 55%; } .skel .date { width: 80%; } .skel .heb { width: 60%; margin-top: 5px; }
  @keyframes pulse { 50% { opacity: .55; } }

  #end { height: 60px; text-align: center; color: var(--faint); font-size: 13px; padding-top: 20px; }

  .now {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 18px); transform: translate(-50%, 24px);
    opacity: 0; pointer-events: none; transition: .25s ease;
    padding: 12px 18px; border-radius: 999px; border: 0; font: 600 14px var(--sans); color: #2a1500;
    background: linear-gradient(90deg, var(--amber-deep), var(--amber)); box-shadow: 0 10px 28px rgba(255, 138, 61, .35);
    display: flex; align-items: center; gap: 8px; z-index: 6;
  }
  .now.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .now svg { width: 16px; height: 16px; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .now[data-dir="up"] svg { transform: rotate(180deg); }


  /* ---------- location sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(5, 3, 8, .62); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82vh; overflow-y: auto;
    padding: 10px 16px calc(var(--safe-bottom) + 20px); border-radius: 26px 26px 0 0;
    background: #211829; border-top: 1px solid rgba(255, 180, 84, .25);
    transform: translateY(105%); transition: transform .26s cubic-bezier(.2, .8, .2, 1);
    max-width: 640px; margin: 0 auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet h3 { margin: 0 4px 10px; font: 600 20px var(--serif); }
  .sheet h4 { margin: 18px 6px 8px; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin: 0 0 6px; padding: 12px 14px;
    border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); font: 500 15px var(--sans);
  }
  .opt small { display: block; margin-top: 2px; color: var(--mute); font-size: 12.5px; font-weight: 400; }
  .opt .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--faint); position: relative; }
  .opt.on { border-color: rgba(255, 180, 84, .6); background: rgba(255, 180, 84, .09); }
  .opt.on .dot { border-color: var(--amber); }
  .opt.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--amber); }
  .zip { display: flex; gap: 8px; margin: 0 0 4px; }
  .zip input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .06); color: var(--ink); font: 500 16px var(--sans); letter-spacing: .08em;
  }
  .zip input:focus { outline: 2px solid rgba(255, 180, 84, .55); }
  .zip button {
    padding: 0 20px; border: 0; border-radius: 14px; font: 600 15px var(--sans); color: #2a1500;
    background: linear-gradient(90deg, var(--amber-deep), var(--amber));
  }
  .zip button:disabled { opacity: .5; }
  .opt.confirm { justify-content: space-between; border-color: rgba(255, 138, 120, .5); background: rgba(255, 90, 70, .08); }
  .opt.confirm span { flex: 1; min-width: 0; }
  .opt.confirm button { flex: none; padding: 9px 14px; border-radius: 12px; border: 0; font: 600 13px var(--sans); }
  .opt.confirm .rm { background: #ff7b66; color: #2a0a05; }
  .opt.confirm .no { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .hint { margin: 2px 6px 6px; font-size: 12.5px; color: var(--faint); }
  #results { margin-top: 8px; }
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; margin: 0 0 8px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
  .seg::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 7px); border-radius: 12px;
    background: linear-gradient(90deg, var(--amber-deep), var(--amber)); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .seg[data-on="hebcal"]::before { transform: translateX(calc(100% + 6px)); }
  .seg button { position: relative; z-index: 1; padding: 13px 8px; border: 0; border-radius: 12px; background: transparent; color: var(--mute); font: 600 14px var(--sans); }
  .seg button.on { color: #2a1500; }
  #zipMsg { margin: 6px 6px 0; min-height: 18px; font-size: 12.5px; color: #ff9d8a; }

  .flame { transform-box: fill-box; transform-origin: 50% 90%; }
  header .flame, .week.next .flame { animation: flick 2.6s ease-in-out infinite; }
  header .flame.b, .week.next .flame.b { animation-duration: 3.1s; animation-delay: -.8s; }
  @keyframes flick {
    0%, 100% { transform: scale(1, 1) rotate(-1.5deg); }
    30% { transform: scale(.93, 1.07) rotate(1.5deg); }
    60% { transform: scale(1.04, .96) rotate(-.5deg); }
  }
  @media (prefers-reduced-motion: reduce) { .flame, .skel * { animation: none !important; } }
  @media (max-width: 360px) { .time { font-size: 32px; } }
</style>
</head>
<body>
<header class="top">
  <h1>
    <svg viewBox="0 0 24 24" aria-hidden="true"><g class="flame"><path d="M7.5 3.5c1.3 1.7 2.4 2.8 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.6 1.1-2.7 2.4-4.4z" fill="#ffb454"/><path d="M7.5 5.6c.5.7 1 1.1 1 1.8a1 1 0 0 1-2 0c0-.7.5-1.1 1-1.8z" fill="#ffe2a8"/></g><g class="flame b"><path d="M16.5 3.5c1.3 1.7 2.4 2.8 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.6 1.1-2.7 2.4-4.4z" fill="#ffb454"/><path d="M16.5 5.6c.5.7 1 1.1 1 1.8a1 1 0 0 1-2 0c0-.7.5-1.1 1-1.8z" fill="#ffe2a8"/></g><rect x="5" y="10.5" width="5" height="10.5" rx=".6" fill="#f3e3c3"/><rect x="14" y="10.5" width="5" height="10.5" rx=".6" fill="#f3e3c3"/><rect x="3" y="21.5" width="18" height="1.5" rx=".5" fill="#8a5a2b"/></svg>
    <span class="ttl">Licht<small>Shabbos times</small></span>
  </h1>
  <button class="chip" id="place" title="Update from my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span id="placeText">Locating…</span>
  </button>
</header>

<main>
  <button class="more" id="earlier">Show earlier weeks</button>
  <div id="list"></div>
  <div id="end">Loading later weeks…</div>
</main>

<button class="now" id="nowBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <span>Next Shabbos</span>
</button>


<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Location">
  <h3>Settings</h3>
  <h4 style="margin-top:4px">Times from</h4>
  <div class="seg" id="seg">
    <button data-src="chabad">Chabad.org</button>
    <button data-src="hebcal">Hebcal zmanim</button>
  </div>
  <h4>Location</h4>
  <div id="opts"></div>
  <h4>Add a place</h4>
  <form class="zip" id="zipForm">
    <input id="zipIn" type="search" enterkeyhint="search" placeholder="City or ZIP code" autocomplete="off" autocapitalize="words">
    <button id="zipGo" type="submit">Search</button>
  </form>
  <div id="zipMsg"></div>
  <div id="results"></div>
</div>

<script>
/* ---- Local preview only: when not inside the Android app, fake the bridge so the page can be viewed on a PC. ---- */
if (!window.Android) {
  window.__mock = { src: 'chabad', manual: false, zip: '10001', place: 'New York, NY 10001', saved: [{ zip: '60601', label: 'Chicago, IL 60601', lat: 41.88, lon: -87.62 }, { zip: '90001', label: 'Los Angeles, CA 90001', lat: 33.97, lon: -118.25 }] };
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dfmt = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const t12 = m => { m = Math.round(m); const h = Math.floor(m / 60) % 24; return `${h % 12 || 12}:${pad(m % 60)} ${h >= 12 ? 'PM' : 'AM'}`; };
  const t0 = new Date(); const today = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate(), 12);
  const nextFri = new Date(today); nextFri.setDate(today.getDate() + ((5 - today.getDay() + 7) % 7));
  window.Android = {
    info: () => JSON.stringify({ src: window.__mock.src, place: window.__mock.place, manual: window.__mock.manual, zip: window.__mock.zip, saved: window.__mock.saved, today: iso(today), target: iso(nextFri) }),
    refreshLocation: () => {},
    sheet: () => {},
    setSource: v => { window.__mock.src = v; setTimeout(() => window.__reload(), 100); },
    choose: (zip, label) => { window.__mock.manual = true; window.__mock.zip = zip; window.__mock.place = label; setTimeout(() => { window.__place(label); window.__reload(); }, 200); },
    useLocal: () => { window.__mock.manual = false; window.__mock.zip = '10001'; window.__mock.place = 'New York, NY 10001'; setTimeout(() => { window.__place('New York, NY 10001'); window.__reload(); }, 200); },
    addZip: z => setTimeout(() => { if (z === '00000') return window.__zipError(); window.__mock.saved.push({ zip: z, label: 'Testville, NY ' + z, lat: 41, lon: -74 }); window.Android.choose(z, 'Testville, NY ' + z); }, 300),
    search: (q, id) => setTimeout(() => window.__results(id, [
      { name: 'Springfield', state: 'Illinois', lat: 39.80, lon: -89.64, zips: ['62701'] },
      { name: 'Springfield', state: 'Missouri', lat: 37.21, lon: -93.29, zips: [] },
      { name: 'Springfield', state: 'Massachusetts', lat: 42.10, lon: -72.59, zips: ['01103', '01104'] }]), 300),
    pick: () => setTimeout(() => { window.__mock.saved.push({ zip: '62701', label: 'Springfield, IL 62701', lat: 39.8, lon: -89.6 }); window.Android.choose('62701', 'Springfield, IL 62701'); }, 300),
    remove: z => { window.__mock.saved = window.__mock.saved.filter(x => x.zip !== z); setTimeout(() => window.__refreshSheet(), 50); },
    week: (i, id) => setTimeout(() => {
      const f = new Date(i + 'T12:00:00'), s = new Date(f); s.setDate(f.getDate() + 1);
      const doy = Math.round((f - new Date(f.getFullYear(), 0, 0)) / 864e5);
      const sun = 17 * 60 + 5 - 175 * Math.cos((doy + 10) / 365 * 2 * Math.PI);
      const hm = d => d.toLocaleDateString('en-US-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
      window.__week(id, {
        friday: i, source: window.__mock.src, parsha: 'Toldot',
        fri: { date: dfmt(f), heb: hm(f), candle: t12(sun - 18), sunset: t12(sun) },
        sat: { date: dfmt(s), heb: hm(s), ends: t12(sun + 43), sunset: t12(sun) }
      });
    }, 150 + Math.random() * 500)
  };
}

/* ---------------------------- page ---------------------------- */
const A = window.Android;
let info = JSON.parse(A.info());
const $ = s => document.querySelector(s);
const parse = s => new Date(s + 'T12:00:00');
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addWeeks = (s, n) => { const d = parse(s); d.setDate(d.getDate() + 7 * n); return isoOf(d); };
const DAY = 864e5;
const headH = () => document.querySelector('header.top').offsetHeight + 6;

let weeks = [];                 // ordered Friday ISO strings
const data = new Map();         // iso -> week data from the app
const asked = new Set();
const ids = new Map(); let nextId = 1;

window.setInsets = (t, b) => {
  document.documentElement.style.setProperty('--safe-top', t + 'px');
  document.documentElement.style.setProperty('--safe-bottom', b + 'px');
};
window.__week = (id, w) => {
  const iso = ids.get(id); ids.delete(id);
  if (!iso) return;
  if (!w) { asked.delete(iso); return; }
  data.set(iso, w); fill(iso);
};
window.__place = p => { info.place = p; setPlace(p); $('#place').classList.remove('spin'); };
window.__reload = () => { data.clear(); asked.clear(); ids.clear(); info = JSON.parse(A.info()); init(); };

function setPlace(p) { $('#placeText').textContent = p || 'Set location'; }

function request(iso) {
  if (data.has(iso) || asked.has(iso)) return;
  asked.add(iso);
  const id = nextId++; ids.set(id, iso);
  A.week(iso, id);
}

function timeParts(t) {
  if (!t) return { n: '—', s: '' };
  const m = /^(\d{1,2}:\d{2})\s*([AP]M)$/i.exec(t);
  return m ? { n: m[1], s: m[2].toUpperCase() } : { n: t, s: '' };
}

const flameSvg = () => `<svg viewBox="0 0 24 24" aria-hidden="true"><g class="flame"><path d="M7.5 3.5c1.3 1.7 2.4 2.8 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.6 1.1-2.7 2.4-4.4z" fill="#ffb454"/><path d="M7.5 5.6c.5.7 1 1.1 1 1.8a1 1 0 0 1-2 0c0-.7.5-1.1 1-1.8z" fill="#ffe2a8"/></g><g class="flame b"><path d="M16.5 3.5c1.3 1.7 2.4 2.8 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.6 1.1-2.7 2.4-4.4z" fill="#ffb454"/><path d="M16.5 5.6c.5.7 1 1.1 1 1.8a1 1 0 0 1-2 0c0-.7.5-1.1 1-1.8z" fill="#ffe2a8"/></g><rect x="5" y="10.5" width="5" height="10.5" rx=".6" fill="#f3e3c3"/><rect x="14" y="10.5" width="5" height="10.5" rx=".6" fill="#f3e3c3"/><rect x="3" y="21.5" width="18" height="1.5" rx=".5" fill="#8a5a2b"/></svg>`;
const moonSvg = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#9db0ff"/><path d="M17.5 3l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#e7ecff"/></svg>`;

function rel(iso) {
  const diff = Math.round((parse(iso) - parse(info.today)) / DAY);
  const w = Math.round(diff / 7);
  if (iso === info.target) return 'Next up';
  if (w === 0) return diff < 0 ? 'Earlier this week' : 'This week';
  if (w > 0) return w === 1 ? 'In 1 week' : `In ${w} weeks`;
  return w === -1 ? '1 week ago' : `${-w} weeks ago`;
}

function cardHtml(iso) {
  const f = parse(iso), s = new Date(f); s.setDate(f.getDate() + 1);
  const range = f.getMonth() === s.getMonth()
    ? `${f.toLocaleDateString('en-US', { month: 'short' })} ${f.getDate()}–${s.getDate()}`
    : `${f.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${s.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
  const cls = ['week', iso === info.target ? 'next' : (f < parse(info.today) && iso !== info.target ? 'past' : '')];
  const d = data.get(iso);
  if (!d) cls.push('skel');
  const c = d ? timeParts(d.fri.candle) : { n: '0:00', s: 'PM' };
  const e = d ? timeParts(d.sat.ends) : { n: '0:00', s: 'PM' };
  return `<article class="${cls.join(' ')}" data-iso="${iso}">
    <div class="meta"><span class="tag">${rel(iso)}</span><span>${d && d.parsha ? esc(d.parsha) + ' · ' : ''}${range}</span></div>
    <div class="days">
      <section class="day fri">
        <div class="lbl">${flameSvg()}Candles</div>
        <div class="time">${c.n}<small>${c.s}</small></div>
        <div class="date">${d ? d.fri.date : 'Fri, Jan 1'}</div>
        <div class="heb">${d ? d.fri.heb : '1 Tevet 5787'}</div>
        <div class="sub">${d && d.fri.sunset ? 'Sunset ' + d.fri.sunset : '&nbsp;'}</div>
      </section>
      <section class="day sat">
        <div class="lbl">${moonSvg}Shabbos ends</div>
        <div class="time">${e.n}<small>${e.s}</small></div>
        <div class="date">${d ? d.sat.date : 'Sat, Jan 2'}</div>
        <div class="heb">${d ? d.sat.heb : '2 Tevet 5787'}</div>
        <div class="sub">${d && d.sat.sunset ? 'Sunset ' + d.sat.sunset : '&nbsp;'}</div>
      </section>
    </div>
    ${d && d.source === 'calc' ? '<div class="foot"><b>Estimated</b> — offline calculation, within a minute of Chabad.org.</div>' : ''}
  </article>`;
}

function build() {
  const list = $('#list');
  const prevTop = list.firstElementChild ? list.firstElementChild.getBoundingClientRect().top : null;
  const prevIso = list.querySelector('.week') ? list.querySelector('.week').dataset.iso : null;
  let html = '', month = '';
  for (const iso of weeks) {
    const m = parse(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    if (m !== month) { html += `<h2 class="month">${m}</h2>`; month = m; }
    html += cardHtml(iso);
  }
  list.innerHTML = html;
  if (prevIso) {                                   // keep the view steady when weeks are added above
    const el = list.querySelector(`[data-iso="${prevIso}"]`);
    if (el && prevTop !== null) window.scrollBy(0, el.getBoundingClientRect().top - prevTop);
  }
  weeks.forEach(request);
  watch();
}

function fill(iso) {
  const el = document.querySelector(`.week[data-iso="${iso}"]`);
  if (!el) return;
  const t = document.createElement('div'); t.innerHTML = cardHtml(iso);
  const n = t.firstElementChild; n.classList.add('enter');
  el.replaceWith(n);
  if (iso === info.target) watch();
}

/* initial window: a couple of weeks back, a couple of months ahead; requests go nearest-first */
function init() {
  weeks = [];
  for (let i = -2; i <= 9; i++) weeks.push(addWeeks(info.target, i));
  build();
  const el = document.querySelector(`.week[data-iso="${info.target}"]`);
  if (el && !location.search.includes('noscroll')) window.scrollTo(0, el.getBoundingClientRect().top + scrollY - headH());
}

$('#earlier').onclick = () => {
  const first = weeks[0];
  for (let i = 1; i <= 8; i++) weeks.unshift(addWeeks(first, -i));
  build();
};

const monthOf = iso => parse(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
function appendWeeks(n) {
  const last = weeks[weeks.length - 1];
  let month = monthOf(last), html = '';
  const added = [];
  for (let i = 1; i <= n; i++) {
    const iso = addWeeks(last, i); weeks.push(iso); added.push(iso);
    const m = monthOf(iso);
    if (m !== month) { html += `<h2 class="month">${m}</h2>`; month = m; }
    html += cardHtml(iso);
  }
  $('#list').insertAdjacentHTML('beforeend', html);
  added.forEach(request);
}
const endIo = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) appendWeeks(6); }, { rootMargin: '600px' });
endIo.observe($('#end'));

const nowBtn = $('#nowBtn');
let nowIo = null;
function watch() {
  if (nowIo) nowIo.disconnect();
  const el = document.querySelector(`.week[data-iso="${info.target}"]`);
  if (!el) { nowBtn.dataset.dir = 'down'; nowBtn.classList.add('show'); return; }
  nowIo = new IntersectionObserver(es => {
    const r = es[0];
    nowBtn.dataset.dir = r.boundingClientRect.top < 0 ? 'up' : 'down';
    nowBtn.classList.toggle('show', !r.isIntersecting);
  }, { threshold: .35 });
  nowIo.observe(el);
}
nowBtn.onclick = () => {
  const el = document.querySelector(`.week[data-iso="${info.target}"]`);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - headH(), behavior: 'smooth' });
  else { weeks = []; init(); }
};

/* ---- location picker ---- */
const sheet = $('#sheet'), scrim = $('#scrim');
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let confirmZip = null, results = [], searchId = 0;

function optHtml(kind, o, on, title, sub, extra) {
  return `<button class="opt ${on ? 'on' : ''}" data-kind="${kind}" data-zip="${o.zip || ''}" ${extra || ''}><span class="dot"></span><span>${esc(title)}<small>${esc(sub)}</small></span></button>`;
}
function renderSheet() {
  info = JSON.parse(A.info());
  $('#seg').dataset.on = info.src || 'chabad';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.src === (info.src || 'chabad')));
  const saved = info.saved || [];
  let h = optHtml('auto', { zip: '' }, !info.manual, 'My location', info.manual ? 'Follows your phone' : 'Follows your phone · ' + info.place);
  if (saved.length) {
    h += '<h4>Saved</h4>';
    for (const p of saved) {
      if (confirmZip === p.zip) {
        h += `<div class="opt confirm"><span>Remove ${esc(p.label)}?</span><button class="no" data-act="no">Keep</button><button class="rm" data-act="rm" data-zip="${p.zip}">Remove</button></div>`;
      } else {
        h += optHtml('saved', p, info.manual && info.zip === p.zip, p.label, 'Hold to remove');
      }
    }
  } else {
    h += '<div class="hint">Search below to add a place. Saved places show up here.</div>';
  }
  $('#opts').innerHTML = h;
}
function renderResults() {
  $('#results').innerHTML = results.map((r, i) =>
    optHtml('result', {}, false, `${r.name}, ${r.state}`, r.zips.length ? 'ZIP ' + r.zips[0] : 'Find ZIP', `data-i="${i}"`)).join('');
}
function openSheet() { confirmZip = null; results = []; $('#results').innerHTML = ''; $('#zipMsg').textContent = ''; $('#zipIn').value = ''; renderSheet(); scrim.classList.add('show'); sheet.classList.add('show'); A.sheet(true); }
function closeSheet() { scrim.classList.remove('show'); sheet.classList.remove('show'); $('#zipIn').blur(); A.sheet(false); }
window.__closeSheet = closeSheet;
window.__refreshSheet = () => { confirmZip = null; if (sheet.classList.contains('show')) renderSheet(); };

$('#zipIn').addEventListener('focus', () => setTimeout(() => $('#zipIn').scrollIntoView({ block: 'center', behavior: 'smooth' }), 350));
$('#place').onclick = openSheet;
$('#seg').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.src === (info.src || 'chabad')) return; closeSheet(); A.setSource(b.dataset.src); };
scrim.onclick = closeSheet;

/* hold a saved place to ask about removing it */
let holdTimer = null, held = false;
const opts = $('#opts');
function startHold(e) {
  const b = e.target.closest('.opt[data-kind="saved"]'); if (!b) return;
  held = false;
  holdTimer = setTimeout(() => { held = true; confirmZip = b.dataset.zip; if (navigator.vibrate) navigator.vibrate(15); renderSheet(); }, 550);
}
function endHold() { clearTimeout(holdTimer); }
opts.addEventListener('pointerdown', startHold);
opts.addEventListener('pointerup', endHold);
opts.addEventListener('pointercancel', endHold);
opts.addEventListener('pointermove', e => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 6) endHold(); });
opts.addEventListener('contextmenu', e => e.preventDefault());

opts.onclick = e => {
  if (held) { held = false; return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'rm') { const z = act.dataset.zip; confirmZip = null; A.remove(z); }
    else { confirmZip = null; renderSheet(); }
    return;
  }
  const b = e.target.closest('.opt'); if (!b) return;
  if (b.dataset.kind === 'auto') { $('#place').classList.add('spin'); closeSheet(); A.useLocal(); setTimeout(() => $('#place').classList.remove('spin'), 6000); return; }
  const src = (info.saved || []).find(p => p.zip === b.dataset.zip);
  if (!src) return;
  closeSheet(); A.choose(src.zip, src.label, src.lat, src.lon);
};

$('#results').onclick = e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const r = results[+b.dataset.i]; if (!r) return;
  $('#zipMsg').style.color = 'var(--mute)'; $('#zipMsg').textContent = 'Checking with Chabad.org…';
  A.pick(r.lat, r.lon, r.zips.join(','));
};

$('#zipForm').onsubmit = e => {
  e.preventDefault();
  const q = $('#zipIn').value.trim();
  const msg = $('#zipMsg');
  if (!q) return;
  $('#results').innerHTML = '';
  msg.style.color = 'var(--mute)';
  if (/^\d{5}$/.test(q)) { msg.textContent = 'Checking with Chabad.org…'; $('#zipGo').disabled = true; A.addZip(q); return; }
  if (q.length < 2) { msg.style.color = '#ff9d8a'; msg.textContent = 'Type a city name or a 5-digit ZIP.'; return; }
  msg.textContent = 'Searching…';
  A.search(q, ++searchId);
};
window.__results = (id, list) => {
  if (id !== searchId) return;
  const msg = $('#zipMsg');
  if (!list) { msg.style.color = '#ff9d8a'; msg.textContent = "Couldn't search. Check your connection."; return; }
  if (!list.length) { msg.style.color = '#ff9d8a'; msg.textContent = 'No US place found by that name.'; return; }
  msg.textContent = 'US places only (Chabad.org times use ZIP codes).';
  results = list; renderResults();
};
window.__zipError = () => {
  $('#zipGo').disabled = false; $('#zipMsg').style.color = '#ff9d8a';
  $('#zipMsg').textContent = "Chabad.org doesn't know that place (or the network is down).";
};
const _reload = window.__reload;
window.__reload = () => {
  $('#zipGo').disabled = false; $('#zipIn').value = ''; confirmZip = null;
  if (sheet.classList.contains('show')) closeSheet();
  const l = $('#list'); l.classList.add('swap');
  setTimeout(() => { _reload(); requestAnimationFrame(() => requestAnimationFrame(() => l.classList.remove('swap'))); }, 180);
};

setPlace(info.place);
init();
if (location.search.includes("sheet")) openSheet();
</script>
</body>
</html>
